<div class="container">
    <h1>Create Employee</h1>
    <ul>
        <li>{{errorMessage}}</li>
    </ul>
    <form [formGroup]="empForm" (ngSubmit)="submitForm()">
        <div class="form-group">
            <label>EmployeeID</label>
            <input type="text" formControlName="empid" class="form-control" maxlength="20">
        </div>
        <div class="form-group">
            <label>Name</label>
            <input type="text" class="form-control" formControlName="name" maxlength="50">
        </div>
        <div class="form-group">
            <label>Salary</label>
            <input type="text" formControlName="salary" class="form-control">
        </div>
        <div class="form-group">
            <label>DateOfBirth</label>
            <input type="date" formControlName="dob" class="form-control" id="dob">
        </div>
        <button class="btn btn-primary" type="submit" [disabled]="!empForm.valid">Register</button>
    </form>
</div>
