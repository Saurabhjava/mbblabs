<div class="container">
    <h1>Employee Data</h1>
    <table class="table table-bordered">
        <tr>
            <th>EmployeeID</th>
            <th>Name</th>
            <th>Salary</th>
            <th>DateOfBirth</th>
            <th>Action</th>
        </tr>
        <tr *ngFor="let e of employees">
            <td>{{e.empid}}</td>
            <td>{{e.name}}</td>
            <td>{{e.salary}}</td>
            <td>{{e.dob | date:'dd-MMM-yyyy'}}</td>
            <td>
                <button class="btn btn-link"(click)="deleteEmployee(e.empid)">Remove</button>
                <button class="btn btn-link" [routerLink]="['/employee/update/', e.empid]">Update</button>
            </td>
        </tr>
    </table>
</div>
